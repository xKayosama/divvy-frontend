<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#087F65" />
    <script>
      // Default to dark and apply any saved preference before the first paint.
      let dark = true;
      try {
        dark = localStorage.getItem('divvy.theme') !== 'light';
      } catch {
        // Use dark mode when storage is unavailable.
      }
      document.documentElement.classList.toggle('dark', dark);
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
    </script>
    <title>Divvy</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
